<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carriers del Equipo — New Age Insurance</title>
<style>
  :root{
    --bg:#0f0f12; --bg2:#16161b; --card:#1c1c22; --line:#2a2a33;
    --gold:#d4af37; --gold2:#b8941f; --ink:#f4f1e8; --muted:#a9a49a;
    --green:#35c26e; --red:#e5484d; --blue:#4d9de5;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; padding-bottom:80px;}
  body:not(.owner) .owner-only{display:none !important;}

  header{position:sticky; top:0; z-index:50; background:rgba(15,15,18,.97); backdrop-filter:blur(8px); border-bottom:1px solid var(--gold); padding:14px 18px;}
  .brand{font-size:11px; letter-spacing:4px; color:var(--gold); font-weight:700;}
  .head-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:6px; flex-wrap:wrap;}
  h1{font-size:22px; font-weight:800;}
  h1 .dot{color:var(--gold);}
  .sub{font-size:13px; color:var(--muted); margin-top:4px;}
  .top-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{background:var(--gold); color:#141414; border:none; border-radius:10px; padding:9px 14px; font-weight:800; font-size:14px; cursor:pointer;}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:transparent; color:var(--gold); border:1.5px solid var(--gold);}
  .btn.danger{background:var(--red); color:#fff;}
  .btn.small{padding:6px 10px; font-size:13px;}
  .edit-toggle{background:var(--blue); color:#fff;}
  body.editing .edit-toggle{background:var(--green); color:#0c0c0c;}

  .tabs{display:flex; gap:8px; overflow-x:auto; padding:14px 18px 6px; -webkit-overflow-scrolling:touch;}
  .tab{position:relative; flex:0 0 auto; background:var(--bg2); border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:10px 34px 10px 16px; font-size:14px; font-weight:700; cursor:pointer; white-space:nowrap;}
  .tab.active{background:var(--gold); color:#141414; border-color:var(--gold);}
  .tab .x{position:absolute; right:6px; top:50%; transform:translateY(-50%); width:22px; height:22px; border-radius:50%; border:none; background:rgba(0,0,0,.35); color:#fff; font-size:12px; font-weight:800; cursor:pointer; display:none;}
  body.editing .tab .x{display:block;}
  .tab-add{flex:0 0 auto; background:transparent; border:1.5px dashed var(--gold); color:var(--gold); border-radius:12px; padding:10px 16px; font-size:14px; font-weight:800; cursor:pointer; white-space:nowrap;}

  .wrap{max-width:900px; margin:0 auto; padding:10px 18px;}
  .add-row{display:flex; gap:8px; margin:10px 0 4px;}
  .empty{background:var(--bg2); border:1px dashed var(--line); border-radius:14px; padding:28px; text-align:center; color:var(--muted); font-size:14px;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin:14px 0; position:relative;}
  .card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .card h3{font-size:17px; font-weight:800;}
  .card .url{font-size:12px; color:var(--muted); margin-top:4px; word-break:break-all;}
  .tools{display:none; gap:6px;}
  body.editing .tools{display:flex;}
  .tool{width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--bg2); color:var(--ink); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .tool.del{color:#ff8a8a; border-color:#5a2b2b;}

  .req-btn{display:block; width:100%; margin-top:12px; background:var(--green); color:#06130b; border:none; border-radius:12px; padding:13px; font-size:16px; font-weight:800; cursor:pointer;}
  .req-btn:active{transform:scale(.98);}

  .carriers{margin-top:10px; display:flex; flex-direction:column; gap:8px;}
  .carrier{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:10px 12px;}
  .carrier.requested{border-color:var(--green);}
  .carrier .nm{font-size:14px; font-weight:700;}
  .carrier .st{font-size:11px; font-weight:800; padding:4px 10px; border-radius:20px; background:#3a3a44; color:var(--muted);}
  .carrier.requested .st{background:var(--green); color:#06130b;}
  .carrier .ops{display:flex; gap:6px; align-items:center;}
  .mini{border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px; padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer;}
  .mini.go{color:var(--green); border-color:#2c5b3f;}
  .mini.undo{color:var(--muted);}
  body:not(.editing) .carrier .ops .mini:not(.go):not(.undo){display:none;}
  .add-carrier-btn{margin-top:8px; width:100%; background:transparent; border:1.5px dashed var(--line); color:var(--muted); border-radius:12px; padding:10px; font-size:13px; font-weight:700; cursor:pointer;}
  body.editing .add-carrier-btn{border-color:var(--gold); color:var(--gold);}

  .panel-toggle{position:fixed; right:16px; bottom:16px; z-index:60; background:var(--gold); color:#141414; border:none; border-radius:30px; padding:13px 18px; font-weight:800; font-size:14px; cursor:pointer; box-shadow:0 6px 24px rgba(0,0,0,.5);}
  .panel{position:fixed; top:0; right:0; bottom:0; width:min(360px,88vw); background:var(--bg2); border-left:1px solid var(--gold); z-index:70; transform:translateX(105%); transition:transform .25s ease; display:flex; flex-direction:column;}
  .panel.open{transform:none;}
  .panel header{position:static; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
  .panel h2{font-size:17px;}
  .panel .list{overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px;}
  .p-item{background:var(--card); border:1px solid var(--line); border-left:4px solid var(--green); border-radius:10px; padding:10px 12px;}
  .p-item .a{font-size:13px; font-weight:800;}
  .p-item .b{font-size:12px; color:var(--muted); margin-top:2px;}
  .p-item .c{font-size:11px; color:var(--muted); margin-top:2px;}
  .p-empty{color:var(--muted); font-size:13px; text-align:center; padding:20px 0;}

  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:100; display:none; align-items:center; justify-content:center; padding:20px;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--bg2); border:1px solid var(--gold); border-radius:16px; width:min(440px,94vw); max-height:88vh; overflow-y:auto; padding:20px;}
  .modal h3{font-size:17px; margin-bottom:12px;}
  .modal label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin:10px 0 4px;}
  .modal input, .modal select{width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:11px 12px; font-size:15px;}
  .modal .row{display:flex; gap:8px; margin-top:16px;}
  .modal .row .btn{flex:1;}
  .modal .err{display:none; background:#3a1d1d; border:1px solid var(--red); color:#ffb3b3; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:10px;}
  .modal .err.show{display:block;}
</style>

"use strict";
/* ================= ACCESO =================
   Candado básico del lado del navegador: evita cambios por accidente o
   curiosidad, pero NO es seguridad de nivel bancario. Cualquiera que sepa
   leer el código de la página podría saltárselo. */
const OWNER_USER = "lester";
const OWNER_PASS_HASH = "07a269764555c641d0668bfcb24468b63ceab1e30e14051ae1f7d6e59b4a208f"; // SHA-256 de la contraseña

async function sha256Hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}
function isOwner(){
  try { return sessionStorage.getItem("nai_owner") === "1"; } catch(e){ return false; }
}
function setOwner(on){
  try {
    if(on) sessionStorage.setItem("nai_owner","1");
    else sessionStorage.removeItem("nai_owner");
  } catch(e){}
  document.body.classList.toggle("owner", on);
  if(!on) document.body.classList.remove("editing");
  document.getElementById("authBtn").textContent = on ? "Cerrar sesión" : "Iniciar sesión";
  render();
}
async function doLogin(){
  const v = await inputModal("Iniciar sesión", [
    {key:"user", label:"Usuario", placeholder:"Usuario"},
    {key:"pass", label:"Contraseña", placeholder:"Contraseña", type:"password"}
  ], "Entrar");
  if(!v) return;
  let h = "";
  try { h = await sha256Hex(v.pass || ""); } catch(e){}
  if(v.user === OWNER_USER && h === OWNER_PASS_HASH){
    setOwner(true);
  } else {
    showErr("Usuario o contraseña incorrectos.");
    const retry = await confirmModal("Acceso denegado", "Los datos no coinciden. ¿Quieres intentarlo de nuevo?", "Reintentar");
    hideModal();
    if(retry) doLogin();
  }
}

function seed(){ return JSON.parse(JSON.stringify(SEED_DATA)); }
function normalize(raw){
  const d = raw && typeof raw === "object" ? raw : {};
  const tabs = Array.isArray(d.tabs) ? d.tabs : [];
  const normTabs = tabs.map(t => {
    if(typeof t === "string") return { id: uid(), name: t, links: [] };
    const links = Array.isArray(t.links) ? t.links : [];
    return {
      id: t.id || uid(),
      name: t.name || "Sin nombre",
      links: links.map(l => {
        if(typeof l === "string") return { id: uid(), name: l, url: "", carriers: [] };
        return {
          id: l.id || uid(),
          name: l.name || "Sin nombre",
          url: l.url || "",
          carriers: Array.isArray(l.carriers) ? l.carriers.map(c =>
            typeof c === "string" ? { id: uid(), name: c, requested: false }
            : { id: c.id || uid(), name: c.name || "Sin nombre", requested: !!c.requested }
          ) : []
        };
      })
    };
  });
  return { tabs: normTabs, activeTab: d.activeTab || (normTabs[0] && normTabs[0].id) || null };
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return normalize(JSON.parse(raw));
  }catch(e){}
  return seed();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

/* ================= MARCAS PERSONALES (visitante sin login) =================
   Cada navegador guarda sus propias marcas en MINE_KEY, separadas de los
   datos publicados. Así cada miembro del equipo marca lo que YA pidió sin
   iniciar sesión y sin afectar a los demás. */
const MINE_KEY = "nai_carriers_mine_v1";
function loadMine(){ try{ return JSON.parse(localStorage.getItem(MINE_KEY)) || {}; }catch(e){ return {}; } }
let mine = loadMine();
function saveMine(){ try{ localStorage.setItem(MINE_KEY, JSON.stringify(mine)); }catch(e){} }
function isMarked(c){ return !!(c.requested || mine[c.id]); }

function getTab(id){ return state.tabs.find(t => t.id === id); }
function activeTab(){ return getTab(state.activeTab) || state.tabs[0]; }
function findCarrier(tabId, linkId, carrierId){
  const t = getTab(tabId); if(!t) return null;
  const l = t.links.find(x => x.id === linkId); if(!l) return null;
  return l.carriers.find(c => c.id === carrierId) || null;
}

/* ================= MODALES ================= */
const modalBg = document.getElementById("modalBg");
const mTitle = document.getElementById("mTitle");
const mFields = document.getElementById("mFields");
const mErr = document.getElementById("mErr");
let mOkHandler = null;
function showErr(msg){ mErr.textContent = msg; mErr.classList.add("show"); }
function hideModal(){ modalBg.classList.remove("show"); mErr.classList.remove("show"); mOkHandler = null; }
function inputModal(title, fields, okText){
  return new Promise(resolve => {
    mTitle.textContent = title;
    mErr.classList.remove("show");
    mFields.innerHTML = "";
    const inputs = {};
    fields.forEach(f => {
      const lab = document.createElement("label"); lab.textContent = f.label;
      const inp = document.createElement("input");
      inp.type = f.type || "text";
      inp.placeholder = f.placeholder || "";
      inp.value = f.value || "";
      mFields.appendChild(lab); mFields.appendChild(inp);
      inputs[f.key] = inp;
    });
    document.getElementById("mOk").textContent = okText || "Guardar";
    modalBg.classList.add("show");
    const done = val => { hideModal(); resolve(val); };
    mOkHandler = () => {
      const out = {};
      for(const k in inputs) out[k] = inputs[k].value.trim();
      done(out);
    };
    document.getElementById("mCancel").onclick = () => done(null);
    const first = mFields.querySelector("input");
    if(first) setTimeout(()=>first.focus(), 60);
  });
}
document.getElementById("mOk").addEventListener("click", ()=>{ if(mOkHandler) mOkHandler(); });
modalBg.addEventListener("click", e => { if(e.target === modalBg) hideModal(); });

function confirmModal(title, msg, okText){
  return new Promise(resolve => {
    mTitle.textContent = title;
    mErr.classList.remove("show");
    mFields.innerHTML = '<p style="font-size:14px;color:var(--muted)">'+escapeHtml(msg)+"</p>";
    const okBtn = document.getElementById("mOk");
    okBtn.textContent = okText || "Eliminar";
    okBtn.classList.add("danger");
    modalBg.classList.add("show");
    const done = val => { okBtn.classList.remove("danger"); hideModal(); resolve(val); };
    mOkHandler = () => done(true);
    document.getElementById("mCancel").onclick = () => done(false);
  });
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ================= RENDER ================= */
const tabsEl = document.getElementById("tabs");
const gridEl = document.getElementById("grid");

function render(){
  renderTabs();
  renderGrid();
  renderPanel();
  document.getElementById("editToggle").textContent = document.body.classList.contains("editing") ? "✔️ Listo" : "✏️ Editar";
}
function renderTabs(){
  tabsEl.innerHTML = "";
  state.tabs.forEach(t => {
    const b = document.createElement("button");
    b.className = "tab" + (t.id === state.activeTab ? " active" : "");
    b.innerHTML = "<span>" + escapeHtml(t.name) + "</span>";
    const x = document.createElement("button");
    x.className = "x"; x.textContent = "✕"; x.title = "Eliminar categoría";
    x.addEventListener("click", ev => { ev.stopPropagation(); delTab(t.id); });
    b.appendChild(x);
    b.addEventListener("click", ()=>{ state.activeTab = t.id; if(isOwner()) save(); render(); });
    b.addEventListener("dblclick", ()=>{ if(isOwner()) renameTab(t.id); });
    tabsEl.appendChild(b);
  });
  if(isOwner()){
    const add = document.createElement("button");
    add.className = "tab-add"; add.textContent = "＋ Categoría";
    add.addEventListener("click", addTab);
    tabsEl.appendChild(add);
  }
}
function linkCard(t, l){
  const card = document.createElement("div");
  card.className = "card";
  const top = document.createElement("div");
  top.className = "card-top";
  const info = document.createElement("div");
  const h3 = document.createElement("h3"); h3.textContent = l.name;
  info.appendChild(h3);
  const tools = document.createElement("div");
  tools.className = "tools";
  const be = document.createElement("button"); be.className = "tool"; be.textContent = "✏️"; be.title = "Editar enlace";
  be.addEventListener("click", ()=>editLink(t.id, l.id));
  const bd = document.createElement("button"); bd.className = "tool del"; bd.textContent = "🗑"; bd.title = "Eliminar enlace";
  bd.addEventListener("click", ()=>delLink(t.id, l.id));
  tools.appendChild(be); tools.appendChild(bd);
  top.appendChild(info); top.appendChild(tools);
  card.appendChild(top);

  const req = document.createElement("button");
  req.className = "req-btn";
  req.textContent = "Solicitar contrato";
  req.addEventListener("click", ()=>{ if(l.url) window.open(l.url, "_blank"); });
  card.appendChild(req);

  const box = document.createElement("div");
  box.className = "carriers";
  l.carriers.forEach(c => {
    const row = document.createElement("div");
    const marked = isMarked(c);
    row.className = "carrier" + (marked ? " requested" : "");
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = c.name;
    const right = document.createElement("div"); right.className = "ops";
    const st = document.createElement("span"); st.className = "st";
    st.textContent = marked ? "Solicitado ✓" : "Pendiente";
    right.appendChild(st);
    const go = document.createElement("button");
    go.className = "mini go";
    const myMark = isOwner() ? !!c.requested : !!mine[c.id];
    go.textContent = myMark ? "Quitar marca" : "Marcar solicitado";
    go.addEventListener("click", ()=>toggleCarrier(t.id, l.id, c.id));
    right.appendChild(go);
    if(document.body.classList.contains("editing")){
      const ce = document.createElement("button"); ce.className = "mini"; ce.textContent = "✏️";
      ce.title = "Editar carrier";
      ce.addEventListener("click", ()=>editCarrier(t.id, l.id, c.id));
      const cd = document.createElement("button"); cd.className = "mini"; cd.textContent = "🗑";
      cd.title = "Eliminar carrier";
      cd.addEventListener("click", ()=>delCarrier(t.id, l.id, c.id));
      right.appendChild(ce); right.appendChild(cd);
    }
    row.appendChild(nm); row.appendChild(right);
    box.appendChild(row);
  });
  card.appendChild(box);

  const addC = document.createElement("button");
  addC.className = "add-carrier-btn owner-only";
  addC.textContent = "＋ Agregar carrier";
  addC.addEventListener("click", ()=>addCarrier(t.id, l.id));
  card.appendChild(addC);
  return card;
}
function renderGrid(){
  gridEl.innerHTML = "";
  const t = activeTab();
  if(!t){
    gridEl.innerHTML = '<div class="empty">Agrega tu primera categoría con «＋ Categoría».</div>';
    return;
  }
  if(!t.links.length){
    gridEl.innerHTML = '<div class="empty">' + (isOwner() ? "Toca «＋ Agregar enlace de contratación» para empezar." : "Aún no hay enlaces en esta categoría.") + "</div>";
    return;
  }
  t.links.forEach(l => gridEl.appendChild(linkCard(t, l)));
}
function renderPanel(){
  const list = document.getElementById("panelList");
  list.innerHTML = "";
  let n = 0;
  const personal = !isOwner();
  state.tabs.forEach(t => t.links.forEach(l => l.carriers.forEach(c => {
    if(personal ? !mine[c.id] : !c.requested) return;
    n++;
    const d = document.createElement("div");
    d.className = "p-item";
    d.innerHTML = '<div class="a">' + escapeHtml(c.name) + '</div><div class="b">' + escapeHtml(l.name) + '</div><div class="c">' + escapeHtml(t.name) + "</div>";
    list.appendChild(d);
  })));
  document.getElementById("reqCount").textContent = n;
  if(!n) list.innerHTML = '<div class="p-empty">Aún no marcas carriers como solicitados.</div>';
}

/* ================= ACCIONES: pestañas ================= */
async function addTab(){
  const v = await inputModal("Nueva categoría", [{key:"name", label:"Nombre", placeholder:"Ej. Visión"}]);
  if(!v || !v.name) return;
  state.tabs.push({ id: uid(), name: v.name, links: [] });
  state.activeTab = state.tabs[state.tabs.length-1].id;
  save(); render();
}
async function renameTab(id){
  const t = getTab(id); if(!t) return;
  const v = await inputModal("Renombrar categoría", [{key:"name", label:"Nombre", value: t.name}]);
  if(!v || !v.name) return;
  const tt = getTab(id); if(!tt) return;
  tt.name = v.name; save(); render();
}
async function delTab(id){
  const t = getTab(id); if(!t) return;
  const ok = await confirmModal("Eliminar categoría", '¿Eliminar "' + t.name + '" y todo su contenido?');
  if(!ok) return;
  state.tabs = state.tabs.filter(x => x.id !== id);
  if(state.activeTab === id) state.activeTab = state.tabs[0] ? state.tabs[0].id : null;
  save(); render();
}

/* ================= ACCIONES: enlaces ================= */
async function addLink(){
  const t = activeTab(); if(!t) return;
  const v = await inputModal("Nuevo enlace de contratación", [
    {key:"name", label:"Nombre del enlace", placeholder:"Ej. SureLC RHP"},
    {key:"url", label:"URL del enlace", placeholder:"https://…"}
  ]);
  if(!v || !v.name) return;
  const tt = activeTab(); if(!tt) return;
  tt.links.push({ id: uid(), name: v.name, url: v.url || "", carriers: [] });
  save(); render();
}
async function editLink(tabId, linkId){
  const t = getTab(tabId); if(!t) return;
  const l = t.links.find(x => x.id === linkId); if(!l) return;
  const v = await inputModal("Editar enlace", [
    {key:"name", label:"Nombre del enlace", value: l.name},
    {key:"url", label:"URL del enlace", value: l.url}
  ]);
  if(!v || !v.name) return;
  const tt = getTab(tabId); if(!tt) return;
  const ll = tt.links.find(x => x.id === linkId); if(!ll) return;
  ll.name = v.name; ll.url = v.url || "";
  save(); render();
}
async function delLink(tabId, linkId){
  const t = getTab(tabId); if(!t) return;
  const l = t.links.find(x => x.id === linkId); if(!l) return;
  const ok = await confirmModal("Eliminar enlace", '¿Eliminar "' + l.name + '" y sus carriers?');
  if(!ok) return;
  const tt = getTab(tabId); if(!tt) return;
  tt.links = tt.links.filter(x => x.id !== linkId);
  save(); render();
}

/* ================= ACCIONES: carriers ================= */
async function addCarrier(tabId, linkId){
  const t = getTab(tabId); if(!t) return;
  const l = t.links.find(x => x.id === linkId); if(!l) return;
  const v = await inputModal("Nuevo carrier", [{key:"name", label:"Nombre del carrier", placeholder:"Ej. Mutual of Omaha"}]);
  if(!v || !v.name) return;
  const tt = getTab(tabId); if(!tt) return;
  const ll = tt.links.find(x => x.id === linkId); if(!ll) return;
  ll.carriers.push({ id: uid(), name: v.name, requested: false });
  save(); render();
}
async function editCarrier(tabId, linkId, carrierId){
  const c = findCarrier(tabId, linkId, carrierId); if(!c) return;
  const v = await inputModal("Editar carrier", [{key:"name", label:"Nombre del carrier", value: c.name}]);
  if(!v || !v.name) return;
  const cc = findCarrier(tabId, linkId, carrierId); if(!cc) return;
  cc.name = v.name; save(); render();
}
async function delCarrier(tabId, linkId, carrierId){
  const c = findCarrier(tabId, linkId, carrierId); if(!c) return;
  const ok = await confirmModal("Eliminar carrier", '¿Eliminar "' + c.name + '"?');
  if(!ok) return;
  const t = getTab(tabId); if(!t) return;
  const l = t.links.find(x => x.id === linkId); if(!l) return;
  l.carriers = l.carriers.filter(x => x.id !== carrierId);
  save(); render();
}
function toggleCarrier(tabId, linkId, carrierId){
  const c = findCarrier(tabId, linkId, carrierId); if(!c) return;
  if(isOwner()){
    c.requested = !c.requested;
    save();
  }else{
    if(mine[c.id]) delete mine[c.id]; else mine[c.id] = true;
    saveMine();
  }
  render();
}

/* ================= EXPORTAR / RESTABLECER ================= */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "carriers-datos.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
async function resetData(){
  const ok = await confirmModal("Restablecer", "¿Volver a la versión publicada? Se perderán los cambios guardados en este navegador.", "Restablecer");
  if(!ok) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  state = seed();
  render();
}

/* ================= UI ================= */
document.getElementById("editToggle").addEventListener("click", ()=>{
  if(!isOwner()) return;
  document.body.classList.toggle("editing");
  render();
});
document.getElementById("addLinkBtn").addEventListener("click", addLink);
document.getElementById("exportBtn").addEventListener("click", exportData);
document.getElementById("resetBtn").addEventListener("click", resetData);
document.getElementById("panelToggle").addEventListener("click", ()=>document.getElementById("panel").classList.add("open"));
document.getElementById("panelClose").addEventListener("click", ()=>document.getElementById("panel").classList.remove("open"));
document.getElementById("authBtn").addEventListener("click", ()=>{
  if(isOwner()) setOwner(false); else doLogin();
});

/* init */
setOwner(false);
render();
</script>
