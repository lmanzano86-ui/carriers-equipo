<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Carriers del Equipo — New Age Insurance</title>
<style>
:root{
  --bg:#0b0b0e; --panel:#15151c; --panel2:#1d1d26;
  --gold:#d9b45b; --gold2:#f3d27a; --gold-deep:#8a6a1c;
  --text:#f4f1e8; --muted:#a8a29a; --line:#2b2b35;
  --green:#3ddc84; --red:#ff7070;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1200px 500px at 50% -10%,#1a1a24 0%,var(--bg) 60%) fixed,var(--bg);
  color:var(--text);min-height:100vh;}
header.top{padding:22px 18px 12px;text-align:center;border-bottom:1px solid var(--line);}
.brand{color:var(--gold);letter-spacing:4px;font-size:12px;font-weight:700;}
header.top h1{margin:8px 0 4px;font-size:24px;}
header.top p{margin:0;color:var(--muted);font-size:13px;}
.top-actions{margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);
  padding:9px 16px;border-radius:10px;font-size:14px;cursor:pointer;}
.btn:active{transform:scale(.97);}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241a05;border:none;font-weight:700;}
.btn.ghost{background:transparent;}
.btn.small{padding:6px 10px;font-size:12px;border-radius:8px;}
.btn.danger{border-color:var(--red);color:var(--red);background:transparent;}
.btn:disabled{opacity:.45;cursor:default;}
body.editing .btn.edit-toggle{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241a05;border:none;font-weight:700;}

/* Tabs */
.tabbar{display:flex;gap:8px;overflow-x:auto;padding:14px 14px 10px;scrollbar-width:thin;}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:14px;cursor:pointer;white-space:nowrap;}
.tab.active{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241a05;border:none;font-weight:700;}
.tab .x{display:none;width:20px;height:20px;border-radius:50%;border:none;background:rgba(0,0,0,.25);
  color:inherit;font-size:12px;cursor:pointer;line-height:1;}
body.editing .tab .x{display:inline-block;}
.tab.add{border-style:dashed;color:var(--gold);}

/* Main */
main{padding:6px 16px 120px;max-width:900px;margin:0 auto;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 12px;}
.section-head h2{margin:0;font-size:18px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);
  border-radius:12px;padding:14px;}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.card-name{font-weight:700;font-size:16px;margin:0;word-break:break-word;}
.card-tools{display:none;gap:6px;}
body.editing .card-tools{display:flex;}
.icon-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;}
.card-url{margin:8px 0 0;font-size:12px;color:var(--muted);word-break:break-all;}
.card-url a{color:var(--gold);text-decoration:none;}
.card-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.link-btn{flex:1;text-align:center;text-decoration:none;display:inline-block;
  background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241a05;font-weight:700;
  padding:10px;border-radius:10px;font-size:14px;}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;
  padding:26px;text-align:center;color:var(--muted);font-size:14px;}
.add-row{margin-top:14px;text-align:center;}

/* Carriers dentro de cada enlace */
.carrier-list{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px;}
.carrier-row{display:flex;align-items:center;gap:8px;background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
.carrier-name{flex:1;font-size:14px;word-break:break-word;}
.carrier-row.requested .carrier-name{color:var(--green);font-weight:600;}
.carrier-row .card-tools .icon-btn{width:26px;height:26px;font-size:12px;}
.req-btn{border:1px solid var(--line);background:transparent;color:var(--muted);
  padding:7px 10px;border-radius:8px;font-size:12px;cursor:pointer;white-space:nowrap;}
.req-btn.on{border-color:var(--green);color:var(--green);font-weight:700;}
.no-carriers{font-size:12px;color:var(--muted);text-align:center;padding:4px;}
.add-carrier-btn{margin-top:10px;width:100%;}

/* Side panel */
.panel-toggle{position:fixed;right:14px;bottom:14px;z-index:40;
  background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241a05;border:none;
  padding:13px 18px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.5);}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);z-index:50;
  background:var(--panel);border-left:1px solid var(--line);transform:translateX(105%);
  transition:transform .25s ease;display:flex;flex-direction:column;}
.panel.open{transform:none;}
.panel-head{padding:16px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between;}
.panel-head h3{margin:0;font-size:16px;}
.panel-body{overflow-y:auto;padding:12px 14px;flex:1;}
.req-item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:10px;}
.req-item .nm{font-weight:700;font-size:14px;color:var(--green);}
.req-item .meta{font-size:12px;color:var(--muted);margin-top:3px;}
.req-item .unmark{margin-top:8px;}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:45;display:none;}
.scrim.show{display:block;}

/* Modal */
.modal-scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;
  display:none;align-items:center;justify-content:center;padding:18px;}
.modal-scrim.show{display:flex;}
.modal{background:var(--panel2);border:1px solid var(--line);border-radius:14px;
  width:100%;max-width:420px;padding:20px;}
.modal h3{margin:0 0 14px;font-size:17px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
.field input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font-size:15px;}
.modal-msg{font-size:14px;color:var(--text);margin:0 0 16px;line-height:1.5;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}

footer{padding:26px 16px 40px;text-align:center;color:var(--gold);font-size:12px;letter-spacing:2px;}
</style>
</head>
<body>

<header class="top">
  <div class="brand">NEW AGE INSURANCE</div>
  <h1>Carriers del Equipo</h1>
  <p>Agrega tus enlaces de contratación y asígnales sus carriers.</p>
  <div class="top-actions">
    <button class="btn edit-toggle" id="editToggle">✏️ Editar</button>
  </div>
</header>

<nav class="tabbar" id="tabbar" aria-label="Categorías"></nav>

<main>
  <div class="section-head">
    <h2 id="tabTitle"></h2>
  </div>
  <div class="grid" id="grid"></div>
  <div class="add-row">
    <button class="btn gold" id="addLinkBtn">＋ Agregar enlace</button>
  </div>
</main>

<button class="panel-toggle" id="panelToggle">📋 Solicitados (<span id="reqCount">0</span>)</button>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-label="Carriers solicitados">
  <div class="panel-head">
    <h3>✅ Carriers solicitados</h3>
    <button class="icon-btn" id="panelClose">✕</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<div class="modal-scrim" id="modalScrim">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-btns" id="modalBtns"></div>
  </div>
</div>

<footer>LESTER MANZANO &nbsp;•&nbsp; 813 235 3313</footer>

<script>
"use strict";
const KEY = "nai_carriers_v2";
const uid = () => "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const shortUrl = u => { try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return u; } };
const normUrl = u => { u = String(u||"").trim(); if(!u) return ""; return /^https?:\/\//i.test(u) ? u : "https://" + u; };
const fmtDate = ts => { try { return new Date(ts).toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"}); } catch(e){ return ""; } };

/* ---------- storage (localStorage con respaldo en memoria) ---------- */
let memFallback = null;
function rawLoad(){
  try { return localStorage.getItem(KEY); } catch(e){ return memFallback; }
}
function rawSave(raw){
  try { localStorage.setItem(KEY, raw); } catch(e){ memFallback = raw; }
}
function seed(){
  const names = ["Seguro de Término","Whole Life","IUL","Gastos Finales","Dental","Accidentes"];
  const tabs = names.map(n => ({ id: uid(), name: n, links: [] }));
  return { tabs, activeTab: tabs[0].id };
}
/* migra el formato anterior (carrier → enlace) al nuevo (enlace → varios carriers) */
function normalize(st){
  if(!st || !Array.isArray(st.tabs)) return seed();
  st.tabs.forEach(t => {
    if(Array.isArray(t.carriers) && !Array.isArray(t.links)){
      const byUrl = {};
      t.carriers.forEach(c => {
        const key = c.url || "__none__";
        if(!byUrl[key]) byUrl[key] = { id: uid(), name: c.name || "Enlace", url: c.url || "", carriers: [] };
        byUrl[key].carriers.push({ id: c.id || uid(), name: c.name, requested: !!c.requested, requestedAt: c.requestedAt || 0 });
      });
      t.links = Object.values(byUrl);
      delete t.carriers;
    }
    if(!Array.isArray(t.links)) t.links = [];
    t.links.forEach(l => { if(!Array.isArray(l.carriers)) l.carriers = []; });
  });
  return st;
}
function loadState(){
  const raw = rawLoad();
  if(raw){ try { return normalize(JSON.parse(raw)); } catch(e){} }
  return seed();
}
function saveState(){ rawSave(JSON.stringify(state)); }
let state = loadState();
if(!state.tabs.length) state = seed();
if(!state.tabs.some(t => t.id === state.activeTab)) state.activeTab = state.tabs[0].id;
const activeTab = () => state.tabs.find(t => t.id === state.activeTab);
const findLink = id => { const t = activeTab(); return t ? t.links.find(l => l.id === id) : null; };

/* ---------- modal ---------- */
const mScrim = document.getElementById("modalScrim");
const mTitle = document.getElementById("modalTitle");
const mBody  = document.getElementById("modalBody");
const mBtns  = document.getElementById("modalBtns");
function closeModal(){ mScrim.classList.remove("show"); }
mScrim.addEventListener("click", e => { if(e.target === mScrim) closeModal(); });

function inputModal(title, fields, okText){
  return new Promise(resolve => {
    mTitle.textContent = title;
    mBody.innerHTML = fields.map(f =>
      `<div class="field"><label>${esc(f.label)}</label>` +
      `<input id="mf_${f.key}" type="${f.type||"text"}" value="${esc(f.value||"")}" placeholder="${esc(f.placeholder||"")}"/></div>`
    ).join("");
    mBtns.innerHTML = "";
    const cancel = document.createElement("button");
    cancel.className = "btn ghost"; cancel.textContent = "Cancelar";
    const ok = document.createElement("button");
    ok.className = "btn gold"; ok.textContent = okText || "Guardar";
    mBtns.append(cancel, ok);
    const done = val => { closeModal(); resolve(val); };
    cancel.onclick = () => done(null);
    ok.onclick = () => {
      const vals = {};
      fields.forEach(f => vals[f.key] = document.getElementById("mf_"+f.key).value.trim());
      done(vals);
    };
    mScrim.classList.add("show");
    const first = mBody.querySelector("input"); if(first) setTimeout(()=>first.focus(),50);
  });
}
function confirmModal(title, msg, okText){
  return new Promise(resolve => {
    mTitle.textContent = title;
    mBody.innerHTML = `<p class="modal-msg">${msg}</p>`;
    mBtns.innerHTML = "";
    const cancel = document.createElement("button");
    cancel.className = "btn ghost"; cancel.textContent = "Cancelar";
    const ok = document.createElement("button");
    ok.className = "btn danger"; ok.textContent = okText || "Eliminar";
    mBtns.append(cancel, ok);
    const done = v => { closeModal(); resolve(v); };
    cancel.onclick = () => done(false);
    ok.onclick = () => done(true);
    mScrim.classList.add("show");
  });
}

/* ---------- render ---------- */
const tabbar = document.getElementById("tabbar");
const grid = document.getElementById("grid");
const tabTitle = document.getElementById("tabTitle");

function render(){
  renderTabs(); renderGrid(); renderPanel();
  saveState();
}
function renderTabs(){
  tabbar.innerHTML = "";
  state.tabs.forEach(t => {
    const b = document.createElement("button");
    b.className = "tab" + (t.id === state.activeTab ? " active" : "");
    const label = document.createElement("span"); label.textContent = t.name;
    b.appendChild(label);
    const x = document.createElement("button");
    x.className = "x"; x.textContent = "✕"; x.title = "Eliminar categoría";
    x.onclick = e => { e.stopPropagation(); deleteTab(t.id); };
    b.appendChild(x);
    b.onclick = () => { state.activeTab = t.id; render(); };
    if(document.body.classList.contains("editing")){
      b.ondblclick = () => renameTab(t.id);
    }
    tabbar.appendChild(b);
  });
  const add = document.createElement("button");
  add.className = "tab add"; add.textContent = "＋ Categoría";
  add.onclick = addTab;
  tabbar.appendChild(add);
}
function linkCard(l){
  const card = document.createElement("div");
  card.className = "card";
  const top = document.createElement("div"); top.className = "card-top";
  const nm = document.createElement("p"); nm.className = "card-name"; nm.textContent = l.name;
  const tools = document.createElement("div"); tools.className = "card-tools";
  const eb = document.createElement("button"); eb.className = "icon-btn"; eb.textContent = "✎"; eb.title = "Editar enlace";
  eb.onclick = () => editLink(l.id);
  const db = document.createElement("button"); db.className = "icon-btn"; db.textContent = "🗑"; db.title = "Eliminar enlace y sus carriers";
  db.onclick = () => deleteLink(l.id);
  tools.append(eb, db);
  top.append(nm, tools);
  card.appendChild(top);

  const urlP = document.createElement("p"); urlP.className = "card-url";
  if(l.url){
    const a = document.createElement("a");
    a.href = l.url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "🔗 " + shortUrl(l.url);
    urlP.appendChild(a);
  } else {
    urlP.textContent = "Sin enlace — toca ✎ (modo Editar) para agregarlo.";
  }
  card.appendChild(urlP);

  if(l.url){
    const acts = document.createElement("div"); acts.className = "card-actions";
    const go = document.createElement("a");
    go.className = "link-btn"; go.href = l.url; go.target = "_blank"; go.rel = "noopener";
    go.textContent = "Solicitar contrato";
    acts.appendChild(go);
    card.appendChild(acts);
  }

  const list = document.createElement("div"); list.className = "carrier-list";
  if(!l.carriers.length){
    const d = document.createElement("div");
    d.className = "no-carriers"; d.textContent = "Sin carriers en este enlace.";
    list.appendChild(d);
  }
  l.carriers.forEach(c => {
    const row = document.createElement("div");
    row.className = "carrier-row" + (c.requested ? " requested" : "");
    const name = document.createElement("span"); name.className = "carrier-name"; name.textContent = c.name;
    const ctools = document.createElement("div"); ctools.className = "card-tools";
    const ceb = document.createElement("button"); ceb.className = "icon-btn"; ceb.textContent = "✎"; ceb.title = "Editar carrier";
    ceb.onclick = () => editCarrier(l.id, c.id);
    const cdb = document.createElement("button"); cdb.className = "icon-btn"; cdb.textContent = "🗑"; cdb.title = "Eliminar carrier";
    cdb.onclick = () => deleteCarrier(l.id, c.id);
    ctools.append(ceb, cdb);
    const rq = document.createElement("button");
    rq.className = "req-btn" + (c.requested ? " on" : "");
    rq.textContent = c.requested ? "✓ Solicitado" : "Marcar";
    rq.title = "Marcar como solicitado";
    rq.onclick = () => toggleRequested(l.id, c.id);
    row.append(name, ctools, rq);
    list.appendChild(row);
  });
  card.appendChild(list);

  const addC = document.createElement("button");
  addC.className = "btn small ghost add-carrier-btn";
  addC.textContent = "＋ Agregar carrier";
  addC.onclick = () => addCarrier(l.id);
  card.appendChild(addC);
  return card;
}
function renderGrid(){
  const t = activeTab();
  tabTitle.textContent = t ? t.name : "";
  grid.innerHTML = "";
  if(!t || !t.links.length){
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = "Aún no hay enlaces en esta categoría. Toca «＋ Agregar enlace» para empezar.";
    grid.appendChild(d);
    return;
  }
  t.links.forEach(l => grid.appendChild(linkCard(l)));
}
function renderPanel(){
  const body = document.getElementById("panelBody");
  const req = [];
  state.tabs.forEach(t => t.links.forEach(l => l.carriers.forEach(c => {
    if(c.requested) req.push({ tab: t.name, link: l.name, c });
  })));
  req.sort((a,b) => (b.c.requestedAt||0) - (a.c.requestedAt||0));
  document.getElementById("reqCount").textContent = req.length;
  body.innerHTML = "";
  if(!req.length){
    const d = document.createElement("div");
    d.className = "empty"; d.textContent = "Aún no has marcado ningún carrier como solicitado.";
    body.appendChild(d); return;
  }
  req.forEach(({tab, link, c}) => {
    const d = document.createElement("div"); d.className = "req-item";
    const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = "✓ " + c.name;
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = tab + " • " + link + (c.requestedAt ? " • " + fmtDate(c.requestedAt) : "");
    const un = document.createElement("button"); un.className = "btn small ghost unmark"; un.textContent = "Quitar marca";
    un.onclick = () => {
      for(const t of state.tabs) for(const l of t.links){
        const f = l.carriers.find(x => x.id === c.id);
        if(f){ f.requested = false; f.requestedAt = 0; break; }
      }
      render();
    };
    d.append(nm, meta, un);
    body.appendChild(d);
  });
}

/* ---------- acciones: pestañas ---------- */
async function addTab(){
  const v = await inputModal("Nueva categoría", [{key:"name", label:"Nombre de la categoría", placeholder:"Ej. Medicare"}], "Agregar");
  if(!v || !v.name) return;
  const t = { id: uid(), name: v.name, links: [] };
  state.tabs.push(t); state.activeTab = t.id;
  render();
}
async function renameTab(id){
  const t0 = state.tabs.find(x => x.id === id);
  const v = await inputModal("Renombrar categoría", [{key:"name", label:"Nombre", value: t0 ? t0.name : ""}], "Guardar");
  if(!v || !v.name) return;
  const t = state.tabs.find(x => x.id === id); if(!t) return;
  t.name = v.name; render();
}
async function deleteTab(id){
  const t = state.tabs.find(x => x.id === id); if(!t) return;
  const n = t.links.reduce((a,l) => a + l.carriers.length, 0);
  const ok = await confirmModal("Eliminar categoría",
    `¿Eliminar <b>${esc(t.name)}</b> con sus ${t.links.length} enlace(s) y ${n} carrier(s)? Esta acción no se puede deshacer.`,
    "Eliminar");
  if(!ok) return;
  state.tabs = state.tabs.filter(x => x.id !== id);
  if(!state.tabs.length){ const s = seed(); state.tabs = s.tabs; }
  if(state.activeTab === id) state.activeTab = state.tabs[0].id;
  render();
}

/* ---------- acciones: enlaces ---------- */
async function addLink(){
  const v = await inputModal("Agregar enlace", [
    {key:"name", label:"Nombre del enlace", placeholder:"Ej. Portal de contratación"},
    {key:"url", label:"Enlace para solicitar contratos", placeholder:"https://…", type:"url"}
  ], "Agregar");
  if(!v || !v.name) return;
  activeTab().links.push({ id: uid(), name: v.name, url: normUrl(v.url), carriers: [] });
  render();
}
async function editLink(id){
  const l0 = findLink(id);
  const v = await inputModal("Editar enlace", [
    {key:"name", label:"Nombre del enlace", value: l0 ? l0.name : ""},
    {key:"url", label:"Enlace para solicitar contratos", value: l0 ? l0.url : "", type:"url"}
  ], "Guardar");
  if(!v || !v.name) return;
  const l = findLink(id); if(!l) return;
  l.name = v.name; l.url = normUrl(v.url);
  render();
}
async function deleteLink(id){
  const l0 = findLink(id);
  const ok = await confirmModal("Eliminar enlace",
    `¿Eliminar <b>${esc(l0 ? l0.name : "")}</b> y sus ${l0 ? l0.carriers.length : 0} carrier(s)?`, "Eliminar");
  if(!ok) return;
  const t = activeTab(); if(!t) return;
  t.links = t.links.filter(x => x.id !== id);
  render();
}

/* ---------- acciones: carriers ---------- */
async function addCarrier(linkId){
  const v = await inputModal("Agregar carrier", [
    {key:"name", label:"Nombre del carrier", placeholder:"Ej. Assurity"}
  ], "Agregar");
  if(!v || !v.name) return;
  const l = findLink(linkId); if(!l) return;
  l.carriers.push({ id: uid(), name: v.name, requested: false, requestedAt: 0 });
  render();
}
async function editCarrier(linkId, carrierId){
  const l0 = findLink(linkId);
  const c0 = l0 ? l0.carriers.find(x => x.id === carrierId) : null;
  const v = await inputModal("Editar carrier", [
    {key:"name", label:"Nombre del carrier", value: c0 ? c0.name : ""}
  ], "Guardar");
  if(!v || !v.name) return;
  const l = findLink(linkId); if(!l) return;
  const c = l.carriers.find(x => x.id === carrierId); if(!c) return;
  c.name = v.name;
  render();
}
async function deleteCarrier(linkId, carrierId){
  const l0 = findLink(linkId);
  const c0 = l0 ? l0.carriers.find(x => x.id === carrierId) : null;
  const ok = await confirmModal("Eliminar carrier", `¿Eliminar <b>${esc(c0 ? c0.name : "")}</b> de ${esc(l0 ? l0.name : "")}?`, "Eliminar");
  if(!ok) return;
  const l = findLink(linkId); if(!l) return;
  l.carriers = l.carriers.filter(x => x.id !== carrierId);
  render();
}
function toggleRequested(linkId, carrierId){
  const l = findLink(linkId); if(!l) return;
  const c = l.carriers.find(x => x.id === carrierId); if(!c) return;
  c.requested = !c.requested;
  c.requestedAt = c.requested ? Date.now() : 0;
  render();
}

/* ---------- panel ---------- */
const panel = document.getElementById("panel");
const scrim = document.getElementById("scrim");
function setPanel(open){
  panel.classList.toggle("open", open);
  scrim.classList.toggle("show", open);
}
document.getElementById("panelToggle").onclick = () => setPanel(true);
document.getElementById("panelClose").onclick = () => setPanel(false);
scrim.onclick = () => setPanel(false);

/* ---------- header ---------- */
document.getElementById("editToggle").onclick = () => {
  document.body.classList.toggle("editing");
  renderTabs();
};
document.getElementById("addLinkBtn").onclick = addLink;

render();
